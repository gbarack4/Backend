version: "3.8"
services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: driving_school_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: driving_school
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
